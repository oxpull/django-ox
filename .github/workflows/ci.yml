name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 5.2 does not support Python 3.14.
          - python-version: "3.14"
            django-version: "5.2"
    name: sqlite py${{ matrix.python-version }} dj${{ matrix.django-version }}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=${{ matrix.django-version }}.0"
      # Django ships the Tasks framework from 6.0. On 5.2 it comes from the
      # backport, which django_ox.compat imports instead. Untested, that is a
      # claim rather than a fact, so 5.2 runs the whole suite against it.
      - if: matrix.django-version == '5.2'
        run: python -m pip install "django-tasks>=0.12"
      # A run that hangs is cancelled at the job's 30-minute cap with
      # nothing in the log to say where it sat. SIGABRT at 25 minutes
      # makes faulthandler dump every thread's stack to the log first.
      - run: timeout -s ABRT 1500 python -m pytest -q --cov

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 5.2 does not support Python 3.14.
          - python-version: "3.14"
            django-version: "5.2"
    name: postgres py${{ matrix.python-version }} dj${{ matrix.django-version }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_postgres
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=${{ matrix.django-version }}.0"
      # Django ships the Tasks framework from 6.0. On 5.2 it comes from the
      # backport, which django_ox.compat imports instead. Untested, that is a
      # claim rather than a fact, so 5.2 runs the whole suite against it.
      - if: matrix.django-version == '5.2'
        run: python -m pip install "django-tasks>=0.12"
      # SIGABRT with thread stacks instead of a silent cancellation; see
      # the sqlite job.
      - run: timeout -s ABRT 1500 python -m pytest -q

  # PostgreSQL through Django's connection pool (OPTIONS["pool"] = True, at
  # psycopg_pool's defaults), for the whole suite and every worker process it
  # starts. Each worker process shares one pool between its poll loop, lease
  # renewal and task threads, and a worker whose threads can take the whole
  # pool starves the rest, which no unpooled leg can see. One combination,
  # the newest, as test-postgres-naive has: the grid around it is covered by
  # test-postgres.
  test-postgres-pooled:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: postgres pooled
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_postgres_pooled
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=6.1.0"
      # The dev group carries psycopg[binary,pool]. The next step requires psycopg_pool.
      # If it is missing, the job fails. Django also requires it for pooled connections.
      - run: python -c "import psycopg_pool"
      # SIGABRT with thread stacks instead of a silent cancellation; see
      # the sqlite job.
      - run: timeout -s ABRT 1500 python -m pytest -q

  # USE_TZ off, on PostgreSQL. The one configuration where the lease can end up
  # on two clocks: the raw claim is a hand-written statement, and under this
  # setting it stamps locked_at from the worker rather than the server, because
  # that is what _lease_now() does and the renewal and the reaper both go
  # through it. Nothing in the other legs reaches this branch, so without this
  # job the statement is a claim rather than a fact.
  #
  # TZ is set deliberately away from the container's UTC. With both on the same
  # zone the two clocks agree by accident and the test proves nothing.
  #
  # One combination, not a grid: this leg exists to execute one SQL branch, and
  # the interpreter and Django matrix around it is already covered six ways by
  # test-postgres.
  test-postgres-naive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: postgres USE_TZ=off
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_postgres_naive
      PYTHONFAULTHANDLER: "1"
      TZ: "America/Los_Angeles"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e .
      - run: timeout -s ABRT 1500 python -m pytest -q

  # MySQL 8 takes the generic `SELECT ... FOR UPDATE SKIP LOCKED` claim path,
  # the same branch every non-PostgreSQL database with SKIP LOCKED uses. The
  # README says the claim path works there, so it is tested rather than assumed.
  #
  # A leaner matrix than the other two on purpose: the corners, oldest and
  # newest supported combination, rather than the full grid. The claim path is
  # shared with PostgreSQL and already covered six ways there, so the value here
  # is proving the MySQL adapter and its SQL dialect work at all.
  #
  # PyMySQL rather than mysqlclient: no system headers, no compile step, and
  # tests/settings_mysql.py already registers it under the expected name.
  test-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "6.1"
    name: mysql py${{ matrix.python-version }} dj${{ matrix.django-version }}
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ox
          MYSQL_DATABASE: oxtest
        ports:
          - 33069:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_mysql
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=${{ matrix.django-version }}.0" PyMySQL
      # Django ships the Tasks framework from 6.0. On 5.2 it comes from the
      # backport, which django_ox.compat imports instead. Untested, that is a
      # claim rather than a fact, so 5.2 runs the whole suite against it.
      - if: matrix.django-version == '5.2'
        run: python -m pip install "django-tasks>=0.12"
      # SIGABRT with thread stacks instead of a silent cancellation; see
      # the sqlite job.
      - run: timeout -s ABRT 1500 python -m pytest -q

  # The stored-row reader decodes a date and time by one rule on every driver.
  # psycopg2 and mysqlclient read some of the values it refuses (PostgreSQL's
  # 'infinity' as the largest datetime, a MySQL zero date as None), so the
  # reader's tests run on each of them as well as on psycopg 3 and PyMySQL.
  # Only the reader's file: it is the code the driver changes, and these legs
  # install the driver the suite's other legs leave out. Django prefers
  # psycopg 3 when both are installed, so psycopg is not installed here.
  test-postgres-psycopg2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: postgres psycopg2 (stored-row reader)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_postgres
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "Django~=6.1.0" pytest pytest-django psycopg2-binary prometheus-client "celery>=5.6"
      - run: python -c "from django.db.backends.postgresql import base; assert base.Database.__name__ == 'psycopg2', base.Database"
      - run: timeout -s ABRT 1500 python -m pytest -q tests/test_stored_read.py

  test-mysql-mysqlclient:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: mysql mysqlclient (stored-row reader)
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ox
          MYSQL_DATABASE: oxtest
        ports:
          - 33069:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_mysql
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev pkg-config
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "Django~=6.1.0" pytest pytest-django mysqlclient prometheus-client "celery>=5.6"
      # tests/settings_mysql.py registers PyMySQL only when mysqlclient is
      # missing; this leg installs no PyMySQL, so MySQLdb is mysqlclient.
      - run: python -c "import MySQLdb, sys; assert 'pymysql' not in sys.modules"
      - run: timeout -s ABRT 1500 python -m pytest -q tests/test_stored_read.py

  # A >= install resolves to the newest release and cannot test a floor. This
  # leg pins the floor with == so a regression at the bottom of the supported
  # range fails here.
  #
  # Measured 2026-09-05 on Django 5.2.17, Python 3.12, the whole suite:
  #   0.9.0   105 failed, 368 passed
  #   0.10.0   45 failed, 428 passed
  #   0.11.0   collection error, 0 tests ran
  #   0.12.0   all green
  # Keep this pin and pyproject.toml's [project.optional-dependencies] backport
  # floor in lockstep; raising one without the other silently stops testing it.
  test-backport-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: backport floor (django-tasks==0.12.0)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=5.2.0"
      # ==, not >=. That is the whole point of this job.
      - run: python -m pip install "django-tasks==0.12.0"
      # Fail loudly if resolution drifted off the pin.
      - run: |
          python - <<'PY'
          import importlib.metadata as m
          got = m.version("django-tasks")
          assert got == "0.12.0", f"expected the floor 0.12.0, got {got}"
          print("django-tasks", got)
          PY
      - name: Suite on SQLite at the floor
        run: timeout -s ABRT 1500 python -m pytest -q
      - name: Suite on PostgreSQL at the floor
        run: timeout -s ABRT 1500 python -m pytest -q
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_postgres

  # The same reasoning for psycopg_pool, on the pooled leg. A worker on
  # Django's PostgreSQL pool discards the pool's idle connections with
  # ConnectionPool.drain(), which psycopg_pool has from 3.3.0; on an older one
  # it falls back to testing them, as it did before. The dev group asks for
  # psycopg-pool>=3.3, which resolves to the newest, so this leg pins the
  # oldest release that has drain() and runs the pooled suite on it.
  #
  # Keep this pin and the psycopg-pool floor in pyproject.toml's dev group in
  # lockstep; raising one without the other silently stops testing it.
  test-pool-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: pool floor (psycopg-pool==3.3.0)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_postgres_pooled
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=6.1.0"
      # ==, not >=. That is the whole point of this job.
      - run: python -m pip install "psycopg-pool==3.3.0"
      # Fail loudly if resolution drifted off the pin.
      - run: |
          python - <<'PY'
          import importlib.metadata as m
          got = m.version("psycopg-pool")
          assert got == "3.3.0", f"expected the floor 3.3.0, got {got}"
          print("psycopg-pool", got)
          PY
      - name: Suite on pooled PostgreSQL at the floor
        run: timeout -s ABRT 1500 python -m pytest -q

  # Wagtail queues a search-index update through django_tasks.task on every
  # save of an indexed model. The suite never drives a real Wagtail project, so
  # "publish a page, the worker indexes it" was a claim rather than a fact.
  # tools/wagtail_smoke.py publishes a page in a fresh `wagtail start` project on
  # SQLite and requires the update to wait in the queue, run through ox_worker,
  # and turn up in search.
  #
  # Two legs, one per task path. Wagtail imports django_tasks on both: on 5.2
  # it is the backport django_ox.compat targets, on 6.1 its decorator hands
  # task construction to the configured backend's task class.
  #
  # ==, not ranges: a Wagtail, modelsearch, Django or django-tasks release
  # changes what this job runs only when a pin here is bumped. modelsearch is
  # Wagtail's search library: it defines the index-update task and the signal
  # handler that queues it, so each leg pins it beside Wagtail.
  wagtail-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            django-version: "5.2.17"
            wagtail-version: "7.4.3"
            modelsearch-version: "1.3.2"
            checkout-install: '-e ".[backport]"'
          - python-version: "3.14"
            django-version: "6.1.1"
            wagtail-version: "8.0"
            modelsearch-version: "1.3.2"
            checkout-install: "-e ."
    name: wagtail smoke py${{ matrix.python-version }} dj${{ matrix.django-version }} wagtail${{ matrix.wagtail-version }}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install ${{ matrix.checkout-install }}
          "Django==${{ matrix.django-version }}"
          "wagtail==${{ matrix.wagtail-version }}"
          "modelsearch==${{ matrix.modelsearch-version }}"
          "django-tasks==0.12.0"
      # Every wait inside the driver is bounded, and a failure prints the worker
      # log, the task statuses and the active search backend.
      - run: python tools/wagtail_smoke.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e .
      - run: ruff check .
      - run: ruff format --check .
      # A model change without its migration must fail before it ships.
      - run: DJANGO_SETTINGS_MODULE=tests.settings python -m django makemigrations django_ox --check --dry-run

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e .
      - run: mypy --strict src/

  # The docs site deploys by hand (`mkdocs gh-deploy`), so nothing else would
  # catch a broken docs build until it was already live.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  # A published release is immutable, so the metadata is checked on every push
  # rather than for the first time at tag.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python tools/check_release.py
      - run: python -m build
      # Catches a README that would fail to render on the package page.
      - run: twine check --strict dist/*

  # Static analysis of these workflows. It sits under ci-ok because ci-ok is
  # the only check branch protection requires. The binary is installed rather
  # than zizmor-action because the action reports through SARIF by default,
  # which never fails the job. Pinned by version and sha256 like gitleaks in
  # security.yml; dependabot cannot see the pin, so bump both by hand.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install zizmor
        working-directory: ${{ runner.temp }}
        env:
          ZIZMOR_VERSION: "1.30.1"
          ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
        run: |
          set -euo pipefail
          curl -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz
          install zizmor /usr/local/bin/zizmor
          zizmor --version
      # Plain output retains nonzero exit codes for findings, including info.
      # The last three flags stop a zizmor.yml, an inline ignore comment or a
      # .gitignore entry from silencing a finding, so loosening this gate
      # always means editing this step.
      - name: Audit GitHub Actions
        run: zizmor --strict-collection --collect=all --no-config --no-ignores .

  # The one context branch protection requires. Requiring a single summary
  # job instead of every matrix leg means the protection rule survives
  # matrix changes: add a Python or database to the grid and the rule
  # still reads "ci-ok", with the new legs pulled in through needs.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test-sqlite, test-postgres, test-postgres-naive, test-postgres-pooled, test-backport-floor, test-pool-floor, wagtail-smoke, test-mysql, test-postgres-psycopg2, test-mysql-mysqlclient, lint, types, docs, packaging, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON"
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ]
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ]
          [ "${{ contains(needs.*.result, 'skipped') }}" = "false" ]
