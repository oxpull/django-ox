name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["6.0", "6.1"]
    name: sqlite py${{ matrix.python-version }} dj${{ matrix.django-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=${{ matrix.django-version }}.0"
      - run: python -m pytest -q --cov

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["6.0", "6.1"]
    name: postgres py${{ matrix.python-version }} dj${{ matrix.django-version }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ox
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings_postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e . "Django~=${{ matrix.django-version }}.0"
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e .
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev -e .
      - run: mypy --strict src/

  # The docs site deploys by hand (`mkdocs gh-deploy`), so nothing else would
  # catch a broken docs build until it was already live.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  # A published release is immutable, so the metadata is checked on every push
  # rather than for the first time at tag.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python tools/check_release.py
      - run: python -m build
      # Catches a README that would fail to render on the package page.
      - run: twine check --strict dist/*
