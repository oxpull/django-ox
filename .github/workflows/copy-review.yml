name: Copy review (advisory)

# The judgement half of the copy standard. tools/copy_lint.py catches the known
# patterns deterministically and blocks on them; this reads for the things a
# regex cannot judge: whether a claim is defensible, whether a paragraph earns
# its place, whether a page handles the paid tier plainly.
#
# Deliberately advisory, not a merge gate. A model reviewer is nondeterministic:
# it will occasionally object to correct copy and occasionally wave through weak
# copy, and a blocking gate with that profile teaches people to force past it.
# The blocking layer is copy_lint. This one leaves a comment.
#
# Opt-in. Without an ANTHROPIC_API_KEY secret the job reports that it is
# disabled and succeeds, so the workflow is inert until enabled and does not
# show up as a failure in the meantime.
#
# To enable:
#   gh secret set ANTHROPIC_API_KEY --repo oxpull/django-ox
# There is a per-run cost. The in-session `external-copy-review` skill covers
# the same ground for free when the copy is being written, which is the cheaper
# place to catch it.

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/**/*.md"
      - "benchmarks/**/*.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the reviewer is enabled
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Copy review is disabled: no ANTHROPIC_API_KEY secret set."
          fi

      - name: Review the changed copy
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review only the external-facing prose changed in this pull request.
            These files are read by strangers deciding whether to install this
            package or pay for a licence.

            Read the diff four times, once as each of these, and report per
            finding which lens caught it:

            1. Sales and GTM. Does the opening say what this is and who it is
               for? Is there a claim a competitor could not also make?
            2. Product and engineering leadership. Is every claim true and
               provable in under a minute? Are the numbers current, and do they
               carry the methodology that makes them quotable?
            3. A hostile reader who knows Django and queues. What is the weakest
               claim, and how would they quote it against us? Does anything read
               as concealment?
            4. Brand. One name for the company (Oxpull) and one for the package
               (django-ox, lowercase, hyphenated). Same claim in the same words
               across surfaces.

            Hard rules, already settled, report any violation as blocking:
            - Nothing may describe the product as weak, slow, buggy, unfinished,
              or losing a comparison. Scope statements yes, deficiency lists no.
            - No narration of pre-release defects. "The benchmark caught two
              real bugs" and "the runs we lost before fixing the worker" are the
              banned shape. The current behaviour is the story.
            - No mention of Claude, ChatGPT, an LLM, or AI generation anywhere.
            - No internal markers, placeholders, TODOs.
            - No em-dashes, no emoji, no marketing filler.

            Be specific and quote the line. If the copy is good, say so briefly
            rather than inventing findings. Post one comment; do not approve or
            request changes.
