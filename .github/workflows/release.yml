name: Release

on:
  push:
    tags: ["v*"]
  # Dry run. Everything except the upload to PyPI, so this workflow can be
  # exercised on demand instead of being tested for the first time by a tag.
  # It matters here: a release is permanent, and the artifact handoff between
  # the two jobs is the part no other workflow covers.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # Last gate before the upload becomes permanent: the tag must match the
      # declared version, the changelog entry must exist, and the project URLs
      # must be complete. 0.1.0 published without its Documentation URL because
      # nothing checked this, and PyPI metadata cannot be edited afterwards.
      # On a dry run there is no tag to check against, so the tag assertion is
      # skipped and the rest of the checks still run.
      - name: Check the release is consistent
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python tools/check_release.py --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_release.py
          fi
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      # Proves the artifact survived the handoff between jobs. On a dry run
      # this is the last step, so a broken upload/download pairing fails here
      # rather than at tag time.
      - name: Verify the artifact arrived intact
        run: |
          set -euo pipefail
          ls -l dist/
          test -n "$(find dist -name '*.whl' -print -quit)" || {
            echo "::error::no wheel in the downloaded artifact"; exit 1; }
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || {
            echo "::error::no sdist in the downloaded artifact"; exit 1; }
          python -m pip install --upgrade pip twine
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
