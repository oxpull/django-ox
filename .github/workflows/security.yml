name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a CVE published against a dependency after merge still
    # surfaces without waiting for the next push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Secret scanning. This project publishes through trusted publishing, so
  # there is never a credential in the tree; this proves it.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Gitleaks scans commits, not just the worktree, so it needs history.
          fetch-depth: 0
      # The gitleaks CLI is MIT and free. Its GitHub Action wrapper requires a
      # paid licence key for organization-owned repositories, which this is, so
      # the binary is installed directly instead. Pinned by version and by the
      # sha256 from the release's checksums file: this runs on every push and
      # a release is a supply-chain surface.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history for credentials
        run: gitleaks git --redact --verbose --no-banner .

  # Static analysis for security defects in our own code. The worker executes
  # a dotted path read from a database row, which is the highest-risk surface
  # in the package, so this class of check earns its place.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2

  # Note: there is no separate bandit job. The same rule family runs as ruff's
  # `S` selector inside the existing lint job, which is faster and one tool
  # fewer to keep configured. src/ passes it; tests/ ignore the assert and
  # temp-path rules on purpose.

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      # Audit the declared dependencies rather than the installed environment.
      # Auditing the environment means auditing django-ox itself, and looking up
      # our own version on PyPI fails for every commit between a version bump
      # and its release. `--skip-editable` does not help: `--strict` counts a
      # skipped distribution as unaudited and fails anyway.
      - name: Collect declared dependencies
        run: |
          python - > requirements-audit.txt <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          deps = list(data["project"]["dependencies"])
          deps += data.get("dependency-groups", {}).get("dev", [])
          print("\n".join(deps))
          PY
          cat requirements-audit.txt
      - run: pip-audit --strict --desc -r requirements-audit.txt

  # A trusted-publishing project has no credential to keep in the tree.
  artifacts:
    name: credential-shaped files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: No credential-shaped files tracked
        run: |
          set -uo pipefail
          patterns='\.env$|\.pem$|\.p12$|id_rsa|\.pypirc|credentials\.json|secrets?\.(ya?ml|json|toml)$'
          if git ls-files | grep -nE "$patterns"; then
            echo "::error::Credential-shaped file tracked."
            exit 1
          fi
          echo "No credential-shaped files tracked."

  # zizmor with a token, which turns on the audits that ask GitHub about each
  # pinned action: impostor-commit (the SHA must be on a branch or tag of the
  # action's own repository, not only in a fork), known-vulnerable-actions and
  # ref-version-mismatch. The ci.yml run stays offline because it sits under
  # ci-ok, which branch protection requires, and these answers can change
  # while the tree does not: an API outage, or a new advisory against a
  # reviewed pin. Here a failure shows on the pull request and the weekly run
  # but blocks no merge. Same binary, checksum and flags as ci.yml; bump both
  # together.
  zizmor-online:
    name: zizmor online audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install zizmor
        working-directory: ${{ runner.temp }}
        env:
          ZIZMOR_VERSION: "1.30.1"
          ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
        run: |
          set -euo pipefail
          curl -sSfL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz
          install zizmor /usr/local/bin/zizmor
          zizmor --version
      - name: Audit GitHub Actions (online)
        env:
          # Read-only: this workflow grants contents: read and nothing else.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --collect=all --no-config --no-ignores .
