name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a CVE published against a dependency after merge still
    # surfaces without waiting for the next push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Secret scanning. This project handles a PyPI publishing identity, and the
  # standing rule is that no token goes through any channel. Trusted publishing
  # means there should never be a credential in the tree; this proves it.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan commits, not just the worktree.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis for security defects in our own code. The worker executes
  # a dotted path read from a database row, which is the highest-risk surface
  # in the package, so this class of check earns its place.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  # Note: there is no separate bandit job. The same rule family runs as ruff's
  # `S` selector inside the existing lint job, which is faster and one tool
  # fewer to keep configured. src/ was verified clean at zero findings when it
  # was enabled; tests/ ignore the assert and temp-path rules on purpose.

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e .
      - run: pip-audit --strict --desc

  # Anything that would leak an internal artefact into a public release.
  # BUILD-NOTES.md, RELEASE-CHECKLIST.md and .contract-ref/ were all tracked in
  # this repo once. .gitignore now excludes them by name; this catches the
  # renamed or newly invented equivalent.
  artifacts:
    name: internal artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No internal artefacts tracked
        run: |
          set -uo pipefail
          patterns='BUILD-NOTES|RELEASE-CHECKLIST|\.contract-ref|internal-notes|SESSION-|HANDOFF|PHILIP|night-shift|STATE\.json|KILL\.md'
          if git ls-files | grep -nEi "$patterns"; then
            echo "::error::Internal artefact tracked in a public repository."
            exit 1
          fi
          echo "No internal artefacts tracked."
      - name: No credential-shaped files tracked
        run: |
          set -uo pipefail
          patterns='\.env$|\.pem$|\.p12$|id_rsa|\.pypirc|credentials\.json|secrets?\.(ya?ml|json|toml)$'
          if git ls-files | grep -nE "$patterns"; then
            echo "::error::Credential-shaped file tracked."
            exit 1
          fi
          echo "No credential-shaped files tracked."
