# A throwaway database: data lives in an emptyDir and dies with the pod.
# max_connections is the budget the check holds the workers to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ox-db
  namespace: ox-keda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ox-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ox-db
    spec:
      containers:
        - name: postgres
          image: postgres:16.16-trixie
          args: ["-c", "max_connections=40"]
          env:
            - name: POSTGRES_DB
              value: ox
            - name: POSTGRES_USER
              value: ox
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ox-keda
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ox", "-d", "ox"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ox-db
  namespace: ox-keda
spec:
  selector:
    app.kubernetes.io/name: ox-db
  ports:
    - port: 5432
