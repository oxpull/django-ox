site_name: django-ox
site_description: Database-backed worker backend for Django's Tasks framework.
site_url: https://oxpull.com/django-ox/
repo_url: https://github.com/oxpull/django-ox

exclude_docs: |
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  font: false
  custom_dir: overrides
  logo: assets/mark-ox.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: !relative $config_dir

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Recurring tasks: recurring-tasks.md
  - Common patterns: patterns.md
  - Migrating: migrating.md
  - Choosing a backend: choosing.md
  - Production: production.md
  - Monitoring: monitoring.md
  - Benchmarks: benchmarks.md
  - API stability: stability.md
  - Pro: pro.md
  - For AI assistants: agents.md
  - Changelog: changelog.md
