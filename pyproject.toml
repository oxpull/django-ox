[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-ox"
version = "1.0.0"
description = "Database-backed worker backend for Django's Tasks framework."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["Django>=5.2"]
authors = [{ name = "Oxpull" }]
keywords = [
    "django",
    "tasks",
    "background-tasks",
    "task-queue",
    "queue",
    "worker",
    "database",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Django ships the Tasks framework from 6.0. On Django 5.2 LTS the same
# framework comes from the django-tasks backport, and django-ox targets it
# through django_ox.compat. Nothing else changes.
#
# The floor is 0.12 because that is the oldest release the suite passes on, not
# because it is the newest release. Measured 2026-09-05, whole suite, Django
# 5.2.17 on Python 3.12, one version swapped into one venv:
#
#   0.9.0    105 failed, 368 passed  -- Task.__init__() missing a required
#                                       keyword-only argument 'enqueue_on_commit'
#   0.10.0    45 failed, 428 passed  -- OxTask.Status.SUCCESSFUL is not a valid
#                                       TaskResultStatus
#   0.11.0   collection error, 0 ran -- OxBackend cannot be instantiated without
#                                       the abstract method 'save_metadata'
#   0.12.0   473 passed, 5 skipped
#
# These are framework API changes across the backport's own releases, not
# incidental breakage, so do not lower this floor without running the suite
# against the lower version first. The CI job `test-backport-floor` pins this
# exact version with == and exists solely to keep that true; a `>=` install
# always resolves to the newest release and can never test a floor. Raise the
# two together or the floor silently stops being tested.
backport = ["django-tasks>=0.12"]

[project.urls]
Homepage = "https://github.com/oxpull/django-ox"
Documentation = "https://oxpull.com/django-ox/"
Repository = "https://github.com/oxpull/django-ox"
Changelog = "https://github.com/oxpull/django-ox/blob/main/CHANGELOG.md"
Issues = "https://github.com/oxpull/django-ox/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "mypy>=1.16",
    "django-stubs>=6.0",
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/django_ox",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "/.gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_ox"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "watched_attempts: leave the attempt's thread as the run found it, watched or not",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["benchmarks", "site"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "DJ",  # flake8-django
    "T20", # stray print()
    # Readability guards: each had zero findings in src/ when enabled.
    "ERA", # commented-out code left in place
    "TD",  # TODO markers without structure
    "FIX", # FIXME/HACK/XXX left behind
    "S",   # flake8-bandit: security defects in shipped code
    "RET", # tangled return flow
    "PTH", # os.path where pathlib belongs
    "A",   # shadowing a builtin
    "ISC", # implicit string concatenation, usually an editing accident
    "PIE", # unnecessary and duplicated code
    "FBT", # boolean positional arguments
]
ignore = [
    # locked_by uses NULL as a distinct "unlocked" state; an empty-string
    # default would need a migration for zero gain.
    "DJ001",
    # Django's declarative class-attribute style (Meta.indexes, migration
    # dependencies/operations) is not a mutable-default bug.
    "RUF012",
]

# Not enabled, with the reason, so the choice is not re-litigated:
#   ARG  - Django fixes the signatures. `handle(self, *args, **options)` and a
#          signal handler's `frame` are required parameters we cannot consume.
#   SLF  - `_meta` and `_default_manager` are the documented Django access
#          path, not private-member abuse.
#   N818 - `TaskAbandoned` is public API as of 0.1.0. Renaming it for a suffix
#          convention would be a breaking change for cosmetics.
#   TRY, PL, C901 - style families the project does not adopt.

[tool.ruff.lint.per-file-ignores]
# Tests assert, use throwaway credentials, and write to temp paths on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
# Benchmark and maintenance scripts are operator tools, not shipped code.
"tools/**" = ["T20"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.coverage.run]
source = ["django_ox"]
branch = true

[tool.coverage.report]
show_missing = true
# Measured 93.5% on SQLite (2026-08-16); the margin absorbs small drift
# without letting coverage rot.
fail_under = 91
