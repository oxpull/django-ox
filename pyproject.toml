[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-ox"
version = "1.5.0"
description = "Django tasks in your database, with retries and automatic recovery when a worker dies."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["Django>=5.2"]
authors = [{ name = "Oxpull" }]
keywords = [
    "django",
    "tasks",
    "background-tasks",
    "task-queue",
    "queue",
    "worker",
    "database",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Django ships the Tasks framework from 6.0. On Django 5.2 LTS the same
# framework comes from the django-tasks backport, and django-ox targets it
# through django_ox.compat. Nothing else changes.
#
# 0.12 is the first backport release with enqueue_on_commit, the six-value
# result status, and no abstract save_metadata.

backport = ["django-tasks>=0.12"]

[project.urls]
Homepage = "https://github.com/oxpull/django-ox"
Documentation = "https://oxpull.com/django-ox/"
Repository = "https://github.com/oxpull/django-ox"
Changelog = "https://github.com/oxpull/django-ox/blob/main/CHANGELOG.md"
Issues = "https://github.com/oxpull/django-ox/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    "mypy>=1.16",
    "django-stubs>=6.0",
    "psycopg[binary,pool]>=3.2",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/django_ox",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]

# Hatchling force-includes the repository's .gitignore in every sdist, and a
# forced include is not subject to `exclude`. hatch_build.py drops it.
# hatch_build.py itself ships, so an unpacked sdist still builds.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_ox"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "watched_attempts: leave the attempt's thread as the run found it, watched or not",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["benchmarks", "site"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "DJ",  # flake8-django
    "T20", # stray print()
    "ERA", # commented-out code left in place
    "TD",  # TODO markers without structure
    "FIX", # FIXME/HACK/XXX left behind
    "S",   # flake8-bandit: security defects in shipped code
    "RET", # tangled return flow
    "PTH", # os.path where pathlib belongs
    "A",   # shadowing a builtin
    "ISC", # implicit string concatenation, usually an editing accident
    "PIE", # unnecessary and duplicated code
    "FBT", # boolean positional arguments
]
ignore = [
    # locked_by uses NULL as a distinct "unlocked" state; an empty-string
    # default would need a migration for zero gain.
    "DJ001",
    # Django's declarative class-attribute style (Meta.indexes, migration
    # dependencies/operations) is not a mutable-default bug.
    "RUF012",
]

# Not enabled:
#   ARG  - Django fixes the signatures. `handle(self, *args, **options)` and a
#          signal handler's `frame` are required parameters we cannot consume.
#   SLF  - `_meta` and `_default_manager` are the documented Django access
#          path, not private-member abuse.
#   N818 - `TaskAbandoned` is public API as of 0.1.0. Renaming it for a suffix
#          convention would be a breaking change for cosmetics.
#   TRY, PL, C901 - style families the project does not adopt.

[tool.ruff.lint.per-file-ignores]
# Tests assert, use throwaway credentials, and write to temp paths on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
# Benchmark and maintenance scripts are operator tools, not shipped code.
"tools/**" = ["T20"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["mypy_django_plugin.main"]

# The type checker reads the core names, which django-stubs describes, and the
# runtime picks whichever package is installed. django_tasks is the optional
# backport and is not installed in the type-check environment, so its import
# has nothing to resolve against and does not need to.
[[tool.mypy.overrides]]
module = ["django_tasks", "django_tasks.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.coverage.run]
source = ["django_ox"]
branch = true

[tool.coverage.report]
show_missing = true
# The floor sits under the measured SQLite figure, with room for small drift.
fail_under = 91
